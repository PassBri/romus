<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Romus</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    /* Mismo estilo que el modo voz del panel: fondo limpio, la esfera sola, tipografía de Word. */
    :root {
      --bg:#fafafa; --superficie:#ffffff; --hover:#f0f2f5; --linea-2:#d4d8de;
      --texto:#1b1d21; --texto-2:#5c6370; --tenue:#8b919c; --acento:#185abd; --magenta:#b4009e; --error:#c42b1c; --sobre-acento:#fff;
    }
    :root[data-tema="oscuro"] {
      --bg:#111317; --superficie:#1a1d23; --hover:#262a32; --linea-2:#373c46;
      --texto:#eceef2; --texto-2:#a4abb8; --tenue:#737b88; --acento:#4f9bff; --magenta:#ef6ad8; --error:#ff7b72; --sobre-acento:#0b1220;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-tema]) {
      --bg:#111317; --superficie:#1a1d23; --hover:#262a32; --linea-2:#373c46;
      --texto:#eceef2; --texto-2:#a4abb8; --tenue:#737b88; --acento:#4f9bff; --magenta:#ef6ad8; --error:#ff7b72; --sobre-acento:#0b1220;
    } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    body {
      font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, Roboto, sans-serif; font-size: 13px; color: var(--texto);
      display: flex; flex-direction: column; align-items: center; padding: 10px 14px 12px; gap: 8px; overflow: hidden; user-select: none; position: relative;
      -webkit-font-smoothing: antialiased; transition: background .3s;
    }
    .barra { position: absolute; top: 6px; right: 8px; z-index: 2; }
    /* La esfera ocupa el espacio que sobra: nunca empuja los controles fuera de la ventana. */
    .escena { flex: 1 1 0; min-height: 70px; width: 100%; display: flex; justify-content: center; align-items: center; }
    .escena canvas { height: 100%; width: auto; aspect-ratio: 1; max-width: 100%; }
    canvas { width: 100%; height: 100%; display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #estado { font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-align: center; min-height: 24px; }
    #sub { flex-shrink: 0; max-height: 3.2em; overflow: hidden; font-size: 14px; line-height: 1.6; text-align: center; color: var(--tenue); width: 100%; padding: 0 4px; }
    #sub span { border-radius: 3px; padding: 0 1px; transition: color .12s, background .12s; }
    #sub span.leida { color: var(--texto); }
    #sub span.actual { color: var(--sobre-acento); background: var(--acento); }
    #sub.usuario { font-style: italic; color: var(--magenta); }
    .controles { margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .fila { display: flex; gap: 16px; align-items: center; }
    button { font: inherit; cursor: pointer; }
    .redondo { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--linea-2); background: var(--superficie); color: var(--texto); display: grid; place-items: center; transition: background .15s, filter .15s; }
    .redondo:hover { background: var(--hover); }
    .redondo.activo { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
    .redondo.cerrar { background: var(--error); border-color: var(--error); color: #fff; }
    .redondo.cerrar:hover { filter: brightness(.92); }
    .redondo.chico { width: 30px; height: 30px; border: none; background: transparent; color: var(--texto-2); }
    .redondo.chico:hover { background: var(--hover); color: var(--texto); }
    .redondo.chico svg { width: 17px; height: 17px; }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    #btnTema .ico-sol { display: none; }
    :root[data-tema="oscuro"] #btnTema .ico-sol { display: block; }
    :root[data-tema="oscuro"] #btnTema .ico-luna { display: none; }
    .caja { width: 100%; display: flex; }
    .caja input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--linea-2); background: var(--superficie); color: var(--texto); outline: none; }
    .caja input:focus { border-color: var(--acento); }
    .caja input::placeholder { color: var(--tenue); }
    .pista { font-size: 11.5px; color: var(--tenue); text-align: center; line-height: 1.5; min-height: 14px; }
    /* Ventanas pequeñas (pantallas de laptop): se compacta en vez de recortarse. */
    @media (max-height: 470px) { .pista { display: none; } #estado { font-size: 15px; min-height: 20px; } .redondo { width: 40px; height: 40px; } body { gap: 6px; } }
    @media (max-height: 400px) { .caja { display: none; } #sub { max-height: 1.6em; font-size: 13px; } }
    @media (max-height: 320px) { #sub { display: none; } }
  </style>
</head>
<body>
  <div class="barra">
    <button id="btnTema" class="redondo chico" title="Modo claro u oscuro" aria-label="Modo claro u oscuro">
      <svg viewBox="0 0 24 24" class="ico-luna"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg viewBox="0 0 24 24" class="ico-sol"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="escena">
    <canvas id="orbe" title="Toca la esfera para hablar con Romus"></canvas>
  </div>
  <div id="estado">Conectando…</div>
  <div id="sub"></div>
  <div class="controles">
    <div class="fila">
      <button id="mic" class="redondo" title="Micrófono" aria-label="Micrófono"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button id="parar" class="redondo" title="Detener lectura" aria-label="Detener"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>
      <button id="cerrar" class="redondo cerrar" title="Cerrar burbuja" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="caja"><input id="txt" placeholder="Escribe o dicta una orden…"></div>
    <div class="pista" id="pista"></div>
  </div>

  <script src="js/config.js?v=3.3"></script>
  <script src="js/voz.js?v=3.3"></script>
  <script src="js/escucha.js?v=3.3"></script>
  <script src="js/orbe.js?v=3.3"></script>
  <script src="js/romus.js?v=3.3"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    let orbe, idioma = "es-CO", estadoPadre = "reposo", bidireccional = false, palabras = [], ultimaTecla = 0, temporizador = null, detenerMedidor = null;
    const esMac = /Mac/i.test(navigator.platform || navigator.userAgent);

    let nivelSuave = 0;
    function nivelCSS(v) { nivelSuave = Math.max(v, nivelSuave * 0.9); document.documentElement.style.setProperty("--nivel", nivelSuave.toFixed(3)); }
    setInterval(() => { nivelSuave *= 0.85; document.documentElement.style.setProperty("--nivel", nivelSuave.toFixed(3)); }, 120);

    function enviar(obj) { try { Office.context.ui.messageParent(JSON.stringify(obj)); } catch (e) { /* sin conexión con el panel */ } }

    function subtitulo(texto, quien) {
      const d = $("sub");
      d.innerHTML = "";
      d.className = quien === "usuario" ? "usuario" : "";
      palabras = texto.split(/\s+/).filter(Boolean);
      palabras.forEach((p, k) => { const s = document.createElement("span"); s.textContent = p; s.dataset.k = k; d.appendChild(s); d.appendChild(document.createTextNode(" ")); });
    }
    function resaltar(k) { $("sub").querySelectorAll("span").forEach(s => { const i = +s.dataset.k; s.className = i < k ? "leida" : i === k ? "actual" : ""; }); }

    function estadoLocal() {
      if (!bidireccional) {
        orbe.estado(Voz.escuchando ? "escuchando" : "reposo");
        $("estado").textContent = Voz.escuchando ? "Di «Ok Romus»" : "Micrófono en pausa";
      }
      $("mic").classList.toggle("activo", Voz.escuchando);
      enviar({ tipo: "escuchando", valor: Voz.escuchando });
    }

    function escuchar() {
      if (!Voz.soportaReconocimiento()) { $("txt").focus(); return; }
      try {
        Voz.iniciar({
          idioma, continuo: true,
          nivel: (v) => { if (estadoPadre !== "hablando") orbe.nivel(v); nivelCSS(v); },
          parcial: (t) => { if (t === "…" || t === "(transcribiendo…)" || t === "") { $("estado").textContent = t ? (t === "…" ? "Te oigo…" : "Entendiendo…") : "Di «Ok Romus»"; return; } if (estadoPadre === "escuchando" || !bidireccional || /^\s*(ok|okey|oye|hola|hey)?[\s,]*r[oó]m/i.test(t)) { if (estadoPadre !== "hablando") { subtitulo(t.replace(/^\s*(ok\w*|oye|hola|hey)?[\s,]*r\w+[\s,.]*/i, ""), "usuario"); orbe.nivel(0.7); } } },
          final: (t) => { enviar({ tipo: "comando", texto: t, origen: "voz" }); },
          error: (e) => {
            if (e === "no-speech") return;
            if (e === "transcripcion" || e === "cuota") { $("pista").textContent = e === "cuota" ? "Límite de la IA por minuto: espera un momento y repite." : "No te entendí, repite por favor."; return; }
            if (e === "sin-transcriptor") { $("pista").textContent = "Para oírte en Word de escritorio, conecta Gemini, OpenAI o Groq en Ajustes del panel."; estadoLocal(); return; }
            $("pista").innerHTML = `El micrófono no está disponible aquí (${e}). Haz clic en la caja y usa ${esMac ? "Fn Fn" : "Windows + H"}.`;
            estadoLocal();
          },
          estado: estadoLocal
        });
      } catch (e) { $("pista").textContent = "No se pudo iniciar el micrófono."; }
    }

    function alMensaje(arg) {
      let m; try { m = JSON.parse(arg.message); } catch (e) { return; }
      if (m.tema) document.documentElement.dataset.tema = m.tema;
      if (m.tipo === "config" || m.tipo === "apariencia") {
        if (m.idioma) idioma = m.idioma;
        if (m.tipo === "config") bidireccional = true;
      }
      else if (m.tipo === "estado") { estadoPadre = m.estado; window.romusHablando = m.estado === "hablando"; orbe.estado(m.estado); $("estado").textContent = m.etiqueta; }
      else if (m.tipo === "subtitulo") subtitulo(m.texto, m.quien);
      else if (m.tipo === "palabra") resaltar(m.k);
      else if (m.tipo === "pulso") { orbe.pulso(); nivelCSS(0.7); }
      else if (m.tipo === "texto" && (m.quien === "accion" || m.quien === "error")) subtitulo(m.texto, "ia");
    }

    Office.onReady(async () => {
      orbe = crearOrbe($("orbe"));
      try { Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, alMensaje); } catch (e) { /* DialogApi 1.2 no disponible */ }
      enviar({ tipo: "lista" });
      subtitulo("Hola, soy Romus. Di «Ok Romus» y lo que necesitas.");
      if (Voz.soportaReconocimiento()) {
        $("pista").textContent = "Di «Ok Romus» y tu orden. Mueve esta ventana donde quieras.";
        escuchar();
      } else {
        $("pista").innerHTML = `Haz clic en la caja y usa ${esMac ? "Fn Fn" : "Windows + H"} para dictar.`;
      }
      estadoLocal();
      detenerMedidor = await Orbe.medirMicrofono((v) => { if (estadoPadre !== "hablando") orbe.nivel(v); nivelCSS(v); });
    });

    $("orbe").addEventListener("click", () => {
      if (!Voz.escuchando) escuchar();
      enviar({ tipo: "despertar" }); // clic en la esfera = «Ok Romus» (y si estaba hablando, lo interrumpe)
    });
    $("mic").addEventListener("click", () => { if (Voz.escuchando) Voz.detenerEscucha(false); else escuchar(); });
    $("btnTema").addEventListener("click", () => {
      // Lo cambia el panel (así quedan iguales); si no responde, cambia solo aquí.
      const antes = document.documentElement.dataset.tema;
      enviar({ tipo: "tema" });
      setTimeout(() => {
        if (document.documentElement.dataset.tema === antes) {
          const oscuro = antes ? antes === "oscuro" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.tema = oscuro ? "claro" : "oscuro";
        }
      }, 400);
    });
    $("parar").addEventListener("click", () => enviar({ tipo: "interrumpir" }));
    $("cerrar").addEventListener("click", () => { Voz.detenerEscucha(true); if (detenerMedidor) detenerMedidor(); enviar({ tipo: "cerrar" }); });

    const txt = $("txt");
    function mandarCaja() { clearTimeout(temporizador); const v = txt.value.trim(); txt.value = ""; if (v) { subtitulo(v, "usuario"); enviar({ tipo: "comando", texto: v, origen: "texto" }); } }
    txt.addEventListener("keydown", (e) => { ultimaTecla = Date.now(); if (e.key === "Enter") { e.preventDefault(); mandarCaja(); } });
    txt.addEventListener("input", () => {
      clearTimeout(temporizador);
      if (Date.now() - ultimaTecla > 1200 && txt.value.trim()) temporizador = setTimeout(mandarCaja, 2800); // dictado del sistema
    });
  })();
  </script>
</body>
</html>
